events:
  case_recipe:
    - {concept: fx_dx, domain: condition, offsets_days: [0, 45], visit_type: fx_visit_outpatient}
  control_recipe:
    - {concept: fx_marker, domain: measurement, unit: mg/dL, probability: 0.9, offsets_days: [0], value: {mean: 3.0, sd: 0.5}, decimals: 1, visit_type: fx_visit_outpatient}
  workup_at_onset: {concepts: [fx_sodium], probability: 0.8}
planted_relationships:
  - {predictor: fx_bmi, effect: "toy cases drawn from a higher-mean BMI distribution", note: "artificial signal so the baseline learns something"}
  - {predictor: fx_creatinine, effect: "toy cases drawn from a slightly higher-mean distribution", note: "artificial"}
  - {predictor: fx_comorbidity, effect: "toy comorbidity more frequent before onset in cases", note: "artificial"}
  - {predictor: index_day_workup, effect: "toy cases get sodium measured on the onset day", note: "exercises exclude_index_day; with same_day include it would leak"}
