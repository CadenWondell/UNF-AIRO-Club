description: >-
  Label construction for aou_htn_current under its PROVISIONAL rules (V-23/V-20): case = (systolic
  >= 130 on >=2 days | diastolic >= 80 on >=2 days | >=2 hypertension diagnoses | diagnosis +
  antihypertensive) and no pregnancy-related or secondary hypertension in the prior year; control =
  >=2 normal systolic and diastolic readings, none >= 140/90, no diagnosis, no antihypertensive.
