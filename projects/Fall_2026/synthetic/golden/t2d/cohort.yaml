provenance: "independently authored synthetic; not derived from any participant data"
fixture: t2d_cohort
description: >-
  Label construction for aou_t2d_current. Encodes the kit's PROVISIONAL rules (V-21/V-20): case =
  (>=2 T2D diagnoses on distinct days | diagnosis + medication | diagnosis + HbA1c >= 6.5 |
  medication + HbA1c >= 6.5) and no type 1/other diabetes code; control = (HbA1c < 5.7 | glucose
  < 100) and no diabetes diagnosis/medication/type 1 code; 365 days of history; age >= 18.
rules:
  case_rule: provisional (V-21)
  control_rule: provisional (V-21)
  min_observation_history: provisional (V-21)
persons:
  - {person_id: SYN-T2D-CASE, birth_date: 1965-01-01, sex_at_birth: SYN-SEX-F, observation_start: 2018-01-01, observation_end: 2026-06-30}
  - {person_id: SYN-T2D-CASE-LAB, birth_date: 1970-01-01, sex_at_birth: SYN-SEX-M, observation_start: 2018-01-01, observation_end: 2026-06-30}
  - {person_id: SYN-T2D-NEARMISS, birth_date: 1970-01-01, sex_at_birth: SYN-SEX-M, observation_start: 2018-01-01, observation_end: 2026-06-30}
  - {person_id: SYN-T2D-T1D, birth_date: 1990-01-01, sex_at_birth: SYN-SEX-F, observation_start: 2018-01-01, observation_end: 2026-06-30}
  - {person_id: SYN-T2D-CONTROL, birth_date: 1975-01-01, sex_at_birth: SYN-SEX-F, observation_start: 2018-01-01, observation_end: 2026-06-30}
  - {person_id: SYN-T2D-CONTROL-GLU, birth_date: 1980-01-01, sex_at_birth: SYN-SEX-M, observation_start: 2018-01-01, observation_end: 2026-06-30}
  - {person_id: SYN-T2D-PREDIABETES, birth_date: 1972-01-01, sex_at_birth: SYN-SEX-M, observation_start: 2018-01-01, observation_end: 2026-06-30}
  - {person_id: SYN-T2D-SHORTHIST, birth_date: 1975-01-01, sex_at_birth: SYN-SEX-F, observation_start: 2025-10-01, observation_end: 2026-06-30}
observations:
