  - {person_id: SYN-T2D-CONTROL, domain: visit, concept_id: SYN-VISIT-OUTPATIENT, start_time: 2023-05-01, time_precision: date, visit_id: SYN-V-T2D-K1}
  - {person_id: SYN-T2D-CONTROL, domain: visit, concept_id: SYN-VISIT-OUTPATIENT, start_time: 2023-06-01, time_precision: date, visit_id: SYN-V-T2D-K2}
  - {person_id: SYN-T2D-CONTROL, domain: visit, concept_id: SYN-VISIT-OUTPATIENT, start_time: 2023-09-01, time_precision: date, visit_id: SYN-V-T2D-K3}
