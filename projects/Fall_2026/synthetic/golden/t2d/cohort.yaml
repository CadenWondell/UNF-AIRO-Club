  - {person_id: SYN-T2D-CASE, domain: condition, concept_id: SYN-T2D-DIAGNOSIS, start_time: 2023-02-01, time_precision: date, visit_id: SYN-V-T2D-C1}
  - {person_id: SYN-T2D-CASE, domain: condition, concept_id: SYN-T2D-DIAGNOSIS, start_time: 2023-05-01, time_precision: date, visit_id: SYN-V-T2D-C2}
  - {person_id: SYN-T2D-CASE, domain: visit, concept_id: SYN-VISIT-OUTPATIENT, start_time: 2023-02-01, time_precision: date, visit_id: SYN-V-T2D-C1}
  - {person_id: SYN-T2D-CASE, domain: visit, concept_id: SYN-VISIT-OUTPATIENT, start_time: 2023-05-01, time_precision: date, visit_id: SYN-V-T2D-C2}
  # case via diagnosis + HbA1c >= 6.5 -> index 2023-03-15
