  - {person_id: SYN-T2D-CONTROL-GLU, domain: visit, concept_id: SYN-VISIT-OUTPATIENT, start_time: 2024-01-10, time_precision: date, visit_id: SYN-V-T2D-G1}
  # prediabetes-range HbA1c, no diagnosis -> not a control (and not a case)
  - {person_id: SYN-T2D-PREDIABETES, domain: measurement, concept_id: SYN-HBA1C, value_num: 6.0, unit_raw: "%", start_time: 2023-06-01, time_precision: date, visit_id: SYN-V-T2D-P1}
  - {person_id: SYN-T2D-PREDIABETES, domain: visit, concept_id: SYN-VISIT-OUTPATIENT, start_time: 2023-06-01, time_precision: date, visit_id: SYN-V-T2D-P1}
