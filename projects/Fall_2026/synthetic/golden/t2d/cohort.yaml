  - {person_id: SYN-T2D-CASE-LAB, domain: measurement, concept_id: SYN-HBA1C, value_num: 7.2, unit_raw: "%", start_time: 2023-03-15, time_precision: date, visit_id: SYN-V-T2D-L2}
