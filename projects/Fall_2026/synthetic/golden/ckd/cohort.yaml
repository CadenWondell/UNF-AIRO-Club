  - {person_id: SYN-CKD-CASE, domain: measurement, concept_id: SYN-EGFR, value_num: 52, unit_raw: "mL/min/{1.73_m2}", start_time: 2023-01-10, time_precision: date, visit_id: SYN-V-CKD-C1}
  - {person_id: SYN-CKD-CASE, domain: measurement, concept_id: SYN-EGFR, value_num: 55, unit_raw: "mL/min/{1.73_m2}", start_time: 2023-03-01, time_precision: date, visit_id: SYN-V-CKD-C2}
