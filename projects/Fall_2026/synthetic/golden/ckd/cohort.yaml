  - {person_id: SYN-CKD-AKI, domain: visit, concept_id: SYN-VISIT-OUTPATIENT, start_time: 2023-04-15, time_precision: date, visit_id: SYN-V-CKD-K3}
  # dialysis/transplant -> cohort exclusion
