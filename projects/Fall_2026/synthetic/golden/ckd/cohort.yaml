  - {person_id: SYN-CKD-CONTROL, domain: measurement, concept_id: SYN-EGFR, value_num: 85, unit_raw: "mL/min/{1.73_m2}", start_time: 2022-06-01, time_precision: date, visit_id: SYN-V-CKD-N1}
