  - {person_id: SYN-CKD-ACR, domain: measurement, concept_id: SYN-URINE-ALBUMIN-PROTEIN, value_num: 60, unit_raw: mg/g, start_time: 2022-10-15, time_precision: date, visit_id: SYN-V-CKD-A2}
