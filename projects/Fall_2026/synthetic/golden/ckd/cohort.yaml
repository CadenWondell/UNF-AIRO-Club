  - {person_id: SYN-CKD-DIALYSIS, domain: measurement, concept_id: SYN-EGFR, value_num: 12, unit_raw: "mL/min/{1.73_m2}", start_time: 2022-06-01, time_precision: date, visit_id: SYN-V-CKD-X1}
  - {person_id: SYN-CKD-DIALYSIS, domain: measurement, concept_id: SYN-EGFR, value_num: 11, unit_raw: "mL/min/{1.73_m2}", start_time: 2022-12-01, time_precision: date, visit_id: SYN-V-CKD-X2}
  - {person_id: SYN-CKD-DIALYSIS, domain: visit, concept_id: SYN-VISIT-OUTPATIENT, start_time: 2022-12-01, time_precision: date, visit_id: SYN-V-CKD-X2}
