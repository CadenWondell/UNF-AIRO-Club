provenance: "independently authored synthetic; not derived from any participant data"
fixture: ckd_cohort
description: >-
  Label construction for aou_ckd_current under its PROVISIONAL rules (V-22/V-20): case = (eGFR < 60
  on >=2 days spanning >=90 days | ACR >= 30 mg/g on >=2 days spanning >=90 days | >=2 CKD
  diagnoses) and no AKI in the prior 90 days; control = >=2 eGFR >= 60, no eGFR < 60, no ACR >= 30,
  no CKD diagnosis; dialysis/transplant excluded; 365 days of history; age >= 18.
rules:
  case_rule: provisional (V-22)
  chronicity_index: provisional (V-22)
  control_rule: provisional (V-22)
persons:
  - {person_id: SYN-CKD-CASE, birth_date: 1955-01-01, sex_at_birth: SYN-SEX-M, observation_start: 2018-01-01, observation_end: 2026-06-30}
  - {person_id: SYN-CKD-ACR, birth_date: 1960-01-01, sex_at_birth: SYN-SEX-F, observation_start: 2018-01-01, observation_end: 2026-06-30}
  - {person_id: SYN-CKD-DX, birth_date: 1958-01-01, sex_at_birth: SYN-SEX-M, observation_start: 2018-01-01, observation_end: 2026-06-30}
  - {person_id: SYN-CKD-SINGLE, birth_date: 1962-01-01, sex_at_birth: SYN-SEX-F, observation_start: 2018-01-01, observation_end: 2026-06-30}
  - {person_id: SYN-CKD-AKI, birth_date: 1950-01-01, sex_at_birth: SYN-SEX-M, observation_start: 2018-01-01, observation_end: 2026-06-30}
  - {person_id: SYN-CKD-DIALYSIS, birth_date: 1950-01-01, sex_at_birth: SYN-SEX-F, observation_start: 2018-01-01, observation_end: 2026-06-30}
  - {person_id: SYN-CKD-CONTROL, birth_date: 1970-01-01, sex_at_birth: SYN-SEX-F, observation_start: 2018-01-01, observation_end: 2026-06-30}
  - {person_id: SYN-CKD-SHORTHIST, birth_date: 1970-01-01, sex_at_birth: SYN-SEX-M, observation_start: 2025-10-01, observation_end: 2026-06-30}
