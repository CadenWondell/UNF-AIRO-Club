# Hypertension phenotype (current state). Every clinical value is PROVISIONAL (synthetic-only)
# until V-23 is verified. Medications alone never establish a case.
id: aou_htn_phenotype
version: 0.1.0
status: requires_verification
description: >-
  Record consistent with hypertension: elevated BP on two or more days, repeated hypertension
  diagnoses, or a diagnosis with an antihypertensive, excluding pregnancy-related and secondary
  hypertension in the prior year. Controls have repeated normal BP without treatment.
provenance:
  - {source_id: acc_aha_bp_2017, locator: "BP classification and diagnosis", application: "Thresholds and repeated-measurement principle", verification_status: requires_verification}
  - {source_id: teixeira_2017_htn, locator: "Methods and results", application: "EHR operationalization (codes, medications, vitals)", verification_status: requires_verification}
deviations: []
case_rule:
  all_of:
    - any_of:
        - measurement: {concept: systolic_bp, op: ">=", value: {provisional: 130.0, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-23, provenance: [{source_id: acc_aha_bp_2017, locator: "BP categories (stage 1)", application: "Candidate source for this threshold", verification_status: requires_verification}]}, unit: mmHg, min_count: {provisional: 2, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-23, provenance: [{source_id: acc_aha_bp_2017, locator: "BP categories (stage 1)", application: "Candidate source for this threshold", verification_status: requires_verification}]}, distinct_days: true}
        - measurement: {concept: diastolic_bp, op: ">=", value: {provisional: 80.0, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-23, provenance: [{source_id: acc_aha_bp_2017, locator: "BP categories (stage 1)", application: "Candidate source for this threshold", verification_status: requires_verification}]}, unit: mmHg, min_count: {provisional: 2, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-23, provenance: [{source_id: acc_aha_bp_2017, locator: "BP categories (stage 1)", application: "Candidate source for this threshold", verification_status: requires_verification}]}, distinct_days: true}
        - has_event: {concept: htn_diagnosis, min_count: {provisional: 2, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-23, provenance: [{source_id: teixeira_2017_htn, locator: "Algorithm input categories", application: "Candidate source for this rule", verification_status: requires_verification}]}, distinct_days: true}
        - all_of:
            - has_event: {concept: htn_diagnosis}
            - has_event: {concept: antihypertensive_medications}
    - not: {has_event: {concept: pregnancy_hypertension, within: {provisional: P365D, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-23, provenance: [{source_id: acc_aha_bp_2017, locator: "BP categories (stage 1)", application: "Candidate source for this threshold", verification_status: requires_verification}]}}}
    - not: {has_event: {concept: secondary_hypertension}}
case_index_rule: {type: first_satisfied}
control_rule:
  all_of:
    - measurement: {concept: systolic_bp, op: "<", value: {provisional: 130.0, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-23, provenance: [{source_id: acc_aha_bp_2017, locator: "BP categories (stage 1)", application: "Candidate source for this threshold", verification_status: requires_verification}]}, unit: mmHg, min_count: {provisional: 2, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-23, provenance: [{source_id: acc_aha_bp_2017, locator: "BP categories (stage 1)", application: "Candidate source for this threshold", verification_status: requires_verification}]}, distinct_days: true}
    - measurement: {concept: diastolic_bp, op: "<", value: {provisional: 80.0, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-23, provenance: [{source_id: acc_aha_bp_2017, locator: "BP categories (stage 1)", application: "Candidate source for this threshold", verification_status: requires_verification}]}, unit: mmHg, min_count: {provisional: 2, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-23, provenance: [{source_id: acc_aha_bp_2017, locator: "BP categories (stage 1)", application: "Candidate source for this threshold", verification_status: requires_verification}]}, distinct_days: true}
    - not: {measurement: {concept: systolic_bp, op: ">=", value: {provisional: 140.0, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-23, provenance: [{source_id: acc_aha_bp_2017, locator: "BP categories (stage 1)", application: "Candidate source for this threshold", verification_status: requires_verification}]}, unit: mmHg}}
    - not: {measurement: {concept: diastolic_bp, op: ">=", value: {provisional: 90.0, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-23, provenance: [{source_id: acc_aha_bp_2017, locator: "BP categories (stage 1)", application: "Candidate source for this threshold", verification_status: requires_verification}]}, unit: mmHg}}
    - not: {has_event: {concept: htn_diagnosis}}
    - not: {has_event: {concept: antihypertensive_medications}}
control_index_rule: {type: eligible_visit, visit_types: [visit_outpatient, visit_inpatient, visit_emergency]}
control_sampling:
  strategy: matched
  controls_per_case: {provisional: 2.0, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-20, provenance: [{source_id: framework_method_decisions, locator: "ADR-002 / V-20", application: "Method decision", verification_status: requires_verification}]}
  match_on: [visit_type, calendar_year]
  seed: 2301
  rationale: "ADR-002: match control index visits to case index visits on visit type and calendar year to limit index-visit bias."
  provenance:
    - {source_id: framework_method_decisions, locator: "docs/decisions/ADR-002-index-visit-bias.md", application: "Control sampling strategy", verification_status: requires_verification}
min_observation_history: {provisional: P365D, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-23, provenance: [{source_id: framework_method_decisions, locator: "ADR-002 / V-20", application: "Method decision", verification_status: requires_verification}]}
repeat_evidence: null
label_defining_concepts: [htn_diagnosis, systolic_bp, diastolic_bp, antihypertensive_medications, pregnancy_hypertension, secondary_hypertension]
