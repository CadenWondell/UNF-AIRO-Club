# Type 2 Diabetes — current-state phenotype inference (Template A). PROVISIONAL values are
# synthetic-only; this kit stays requires_verification until V-20/V-21/V-24/V-25 are verified.
kit_schema: "1.0"
kit_id: aou_t2d_current
name: "Type 2 Diabetes — current-state phenotype inference"
kit_version: 0.1.0
status: requires_verification
dataset: {id: all_of_us, version: UNVERIFIED}
template_family: binary_tabular
clinical_question: >-
  Given clinical information that does not define the phenotype (no diabetes diagnoses, glucose or
  HbA1c values, or diabetes medications), does the patient's record currently meet the type 2
  diabetes phenotype?
target: {code: t2d_phenotype, label: "Type 2 diabetes phenotype (current state)"}
prediction_type: current_state
phenotype: {path: phenotype.yaml, version: 0.1.0}
cohort:
  version: 0.1.0
  inclusion:
    - age_at_index: {op: ">=", years: {provisional: 18, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-21, provenance: [{source_id: ada_soc_2026_s2, locator: "Section 2, diagnostic criteria", application: "Candidate source for this threshold", verification_status: requires_verification}]}}
  exclusion: []
  provenance:
    - {source_id: ada_soc_2026_s2, locator: "Section 2, screening in adults", application: "Adult cohort (candidate)", verification_status: requires_verification}
temporal_policy:
  same_day: {provisional: exclude_index_day, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-20, provenance: [{source_id: framework_method_decisions, locator: "ADR-002 / V-20", application: "Method decision", verification_status: requires_verification}]}
  exclude_index_encounter: {provisional: true, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-20, provenance: [{source_id: framework_method_decisions, locator: "ADR-002 / V-20", application: "Method decision", verification_status: requires_verification}]}
  washout: {provisional: P0D, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-20, provenance: [{source_id: framework_method_decisions, locator: "ADR-002 / V-20", application: "Method decision", verification_status: requires_verification}]}
  lookback: {provisional: P1095D, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-20, provenance: [{source_id: framework_method_decisions, locator: "ADR-002 / V-20", application: "Method decision", verification_status: requires_verification}]}
  windowed_exclusions: []
features:
  - {feature: age, derivations: [latest]}
  - {feature: sex_at_birth, derivations: [latest]}
  - {feature: bmi, derivations: [latest, delta, mean]}
  - {feature: weight, derivations: [latest]}
  - {feature: systolic_bp, derivations: [latest, mean]}
  - {feature: diastolic_bp, derivations: [latest]}
  - {feature: ldl, derivations: [latest]}
  - {feature: hdl, derivations: [latest]}
  - {feature: triglycerides, derivations: [latest]}
  - {feature: creatinine, derivations: [latest]}
  - {feature: alt, derivations: [latest]}
  - {feature: hemoglobin, derivations: [latest]}
  - {feature: outpatient_visits, derivations: [count], window: P365D}
prohibited:
  - {concept: t2d_diagnosis, reason: "label-defining (case evidence)"}
  - {concept: t1d_other_diabetes, reason: "label-defining (exclusion evidence)"}
  - {concept: diabetes_medications, reason: "label-defining (case evidence)"}
  - {feature: hba1c, reason: "label-defining (case and control evidence; earlier values too, FR-134)"}
  - {feature: glucose, reason: "label-defining (control evidence; earlier values too, FR-134)"}
  - {concept: diabetic_complications, reason: "indirect label revealer (V-24 review)"}
  - {concept: glucose_monitoring, reason: "indirect label revealer (V-24 review)"}
  - {concept: diabetes_education, reason: "indirect label revealer (V-24 review)"}
justified_inclusions: []
leakage_risks:
  - {description: "Index-visit bias: cases indexed at diagnostic encounters with dense testing", mitigation: "Exclude index day and encounter; matched control index visits; utilization-only bias check (ADR-002)"}
  - {description: "Labs ordered with the diagnostic HbA1c (lipid and renal panels) on the index day", mitigation: "same_day: exclude_index_day (provisional)"}
  - {description: "Indirect revealers (complications, monitoring supplies, education)", mitigation: "Prohibited after V-24 review"}
missingness: {strategy: median_impute_with_indicator, min_features_present: 3}
baseline:
  model: logistic_regression
  params: {C: 1.0, penalty: l2, class_weight: null, max_iter: 1000, solver: lbfgs}
threshold_rule: youden
metrics: [auroc, auprc, sensitivity, specificity, precision, recall, f1, confusion_matrix, brier]
calibration: {required: true, bins: 10, strategy: quantile, method: grouped_oof_sigmoid}
explainability: {coefficients: true, permutation_importance: true}
split:
  strategy: hash
  fractions: [0.7, 0.15, 0.15]
  salt: aou_t2d_current-s1
  salt_version: 1
  salt_history: []
  min_positives_per_partition: 10
  prevalence_tolerance: 0.05
seed: 2101
synthetic_population: synthetic/generator_params/aou_t2d_current.yaml
sources:
  - {source_id: ada_soc_2026_s2, locator: "Section 2", application: "Diagnostic criteria and classification", verification_status: requires_verification}
  - {source_id: kho_2012_emerge_t2d, locator: "Methods", application: "Validated EHR case/control algorithm structure", verification_status: requires_verification}
  - {source_id: albu_2025_ehr_extraction, locator: "Label leakage near the event", application: "Same-day/index-encounter exclusions", verification_status: requires_verification}
known_limitations:
  - "Probabilities reflect the sampled development prevalence (matched controls, 2 per case), not population prevalence; they are not clinical risk scores."
  - "All clinical values are provisional (synthetic-only) until V-20, V-21, V-24, and V-25 are verified; the kit cannot run in the Workbench yet."
  - "Index-visit bias may remain after matching on visit type and calendar year."
  - "Synthetic data is artificial and not clinically realistic; synthetic results say nothing about real performance."
docs: docs
visit_bias_check:
  utilization_features: [outpatient_visits]
  max_utilization_auroc: 0.70
