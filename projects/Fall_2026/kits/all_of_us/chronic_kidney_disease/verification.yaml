# Narrative notes and decision categories only (P-11). Status lives inline in kit.yaml / phenotype.yaml.
items:
  phenotype.case_rule:
    category: documentation_derived
    note: >-
      V-22a. KDIGO 2024 (kdigo_ckd_2024, text extracted from the official PDF): abnormalities of
      kidney structure or function present for a minimum of 3 months; decreased GFR <60 ml/min per
      1.73 m2 or albuminuria ACR >=30 mg/g. Operationalized as >=2 qualifying values spanning
      >=90 days (min_span), or >=2 CKD diagnoses on distinct days (eMERGE-style, nadkarni_2014_emerge_ckd).
      All thresholds and counts provisional pending reviewer verification.
  phenotype.case_index_rule:
    category: method_decision
    note: "Index = the date chronicity is first satisfied (second qualifying value >=90 days after the first)."
  phenotype.control_rule:
    category: documentation_derived
    note: >-
      V-22b. Controls need repeated normal kidney function: >=2 eGFR values >=60 on distinct days,
      no eGFR <60, no ACR >=30 mg/g, and no CKD diagnosis (provisional).
  phenotype.min_observation_history:
    category: method_decision
    note: "365 days of history (provisional; V-11 observation periods pending)."
  phenotype.control_sampling:
    category: method_decision
    note: "ADR-002 matched sampling on visit type and calendar year, 2 per case (provisional, V-20)."
  phenotype.label_defining_concepts:
    category: documentation_derived
    note: "FR-135: CKD diagnoses, creatinine/eGFR, urine albumin/protein; plus AKI (used to exclude transient decreases)."
  cohort.exclusion:
    category: method_decision
    note: "Dialysis/transplant (kidney failure with replacement therapy) excluded from the cohort for this kit (provisional; V-22a open question)."
  temporal_policy.same_day:
    category: method_decision
    note: "Exclude the index day: the chronicity-confirming creatinine/eGFR is usually drawn with a basic metabolic panel."
  temporal_policy.exclude_index_encounter:
    category: method_decision
    note: "Exclude the confirming encounter (V-20 option C)."
  eGFR:
    category: method_decision
    note: "eGFR is taken from the source measurement (not recomputed); the equation (2021 CKD-EPI per KDIGO 2024) must be checked against the CDR (V-22a, V-25)."
  prohibited:
    category: method_decision
    note: "V-24 review in docs/features.md."
