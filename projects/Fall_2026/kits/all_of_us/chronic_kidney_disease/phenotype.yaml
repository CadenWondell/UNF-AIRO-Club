# Chronic kidney disease phenotype (current state). Every clinical value is PROVISIONAL
# (synthetic-only) until V-22 is verified. Chronicity uses the reusable min_span option.
id: aou_ckd_phenotype
version: 0.1.0
status: requires_verification
description: >-
  Record consistent with CKD: decreased eGFR or albuminuria persisting >= 3 months, or repeated CKD
  diagnoses, without acute kidney injury just before the confirming value. Controls have repeated
  normal kidney function.
provenance:
  - {source_id: kdigo_ckd_2024, locator: "Chapter 1: definition and Table 1", application: "CKD definition and chronicity", verification_status: requires_verification}
  - {source_id: nadkarni_2014_emerge_ckd, locator: "Methods", application: "EHR case/control operationalization", verification_status: requires_verification}
deviations: []
case_rule:
  all_of:
    - any_of:
        - measurement:
            concept: egfr
            op: "<"
            value: {provisional: 60.0, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-22, provenance: [{source_id: kdigo_ckd_2024, locator: "Chapter 1, Table 1 (criteria for CKD)", application: "Candidate source for this value", verification_status: requires_verification}]}
            unit: "mL/min/{1.73_m2}"
            min_count: {provisional: 2, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-22, provenance: [{source_id: nadkarni_2014_emerge_ckd, locator: "eMERGE CKD algorithm (PheKB)", application: "Candidate source for this rule", verification_status: requires_verification}]}
            distinct_days: true
            min_span: {provisional: P90D, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-22, provenance: [{source_id: kdigo_ckd_2024, locator: "Chapter 1, Table 1 (criteria for CKD)", application: "Candidate source for this value", verification_status: requires_verification}]}
        - measurement:
            concept: urine_albumin_protein
            op: ">="
            value: {provisional: 30.0, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-22, provenance: [{source_id: kdigo_ckd_2024, locator: "Chapter 1, Table 1 (criteria for CKD)", application: "Candidate source for this value", verification_status: requires_verification}]}
            unit: mg/g
            min_count: {provisional: 2, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-22, provenance: [{source_id: nadkarni_2014_emerge_ckd, locator: "eMERGE CKD algorithm (PheKB)", application: "Candidate source for this rule", verification_status: requires_verification}]}
            distinct_days: true
            min_span: {provisional: P90D, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-22, provenance: [{source_id: kdigo_ckd_2024, locator: "Chapter 1, Table 1 (criteria for CKD)", application: "Candidate source for this value", verification_status: requires_verification}]}
        - has_event: {concept: ckd_diagnosis, min_count: {provisional: 2, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-22, provenance: [{source_id: nadkarni_2014_emerge_ckd, locator: "eMERGE CKD algorithm (PheKB)", application: "Candidate source for this rule", verification_status: requires_verification}]}, distinct_days: true}
    - not: {has_event: {concept: aki_diagnosis, within: {provisional: P90D, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-22, provenance: [{source_id: kdigo_ckd_2024, locator: "Chapter 1, Table 1 (criteria for CKD)", application: "Candidate source for this value", verification_status: requires_verification}]}}}
case_index_rule: {type: first_satisfied}
control_rule:
  all_of:
    - measurement:
        concept: egfr
        op: ">="
        value: {provisional: 60.0, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-22, provenance: [{source_id: kdigo_ckd_2024, locator: "Chapter 1, Table 1 (criteria for CKD)", application: "Candidate source for this value", verification_status: requires_verification}]}
        unit: "mL/min/{1.73_m2}"
        min_count: {provisional: 2, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-22, provenance: [{source_id: nadkarni_2014_emerge_ckd, locator: "eMERGE CKD algorithm (PheKB)", application: "Candidate source for this rule", verification_status: requires_verification}]}
        distinct_days: true
    - not: {measurement: {concept: egfr, op: "<", value: {provisional: 60.0, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-22, provenance: [{source_id: kdigo_ckd_2024, locator: "Chapter 1, Table 1 (criteria for CKD)", application: "Candidate source for this value", verification_status: requires_verification}]}, unit: "mL/min/{1.73_m2}"}}
    - not: {measurement: {concept: urine_albumin_protein, op: ">=", value: {provisional: 30.0, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-22, provenance: [{source_id: kdigo_ckd_2024, locator: "Chapter 1, Table 1 (criteria for CKD)", application: "Candidate source for this value", verification_status: requires_verification}]}, unit: mg/g}}
    - not: {has_event: {concept: ckd_diagnosis}}
control_index_rule: {type: eligible_visit, visit_types: [visit_outpatient, visit_inpatient, visit_emergency]}
control_sampling:
  strategy: matched
  controls_per_case: {provisional: 2.0, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-20, provenance: [{source_id: framework_method_decisions, locator: "ADR-002 / V-20", application: "Method decision", verification_status: requires_verification}]}
  match_on: [visit_type, calendar_year]
  seed: 2201
  rationale: "ADR-002: match control index visits to case index visits on visit type and calendar year to limit index-visit bias."
  provenance:
    - {source_id: framework_method_decisions, locator: "docs/decisions/ADR-002-index-visit-bias.md", application: "Control sampling strategy", verification_status: requires_verification}
min_observation_history: {provisional: P365D, note: "Provisional for synthetic execution and tests only; not an approved clinical rule.", pending: V-22, provenance: [{source_id: framework_method_decisions, locator: "ADR-002 / V-20", application: "Method decision", verification_status: requires_verification}]}
repeat_evidence: null
label_defining_concepts: [ckd_diagnosis, egfr, creatinine, urine_albumin_protein, aki_diagnosis]
