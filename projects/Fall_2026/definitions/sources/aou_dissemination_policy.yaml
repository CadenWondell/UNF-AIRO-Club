notes: >-
  Policy statement: (1) no participant count of 1 to 20 may be published or distributed directly
  (a count of 0 is permitted); (2) no data or statistics may be reported that allow a participant
  count of 1 to 20 to be derived from other reported cells or information, including percentages
  or other formulas. Applies to anything that leaves the Researcher Workbench (publication or
  distribution, including a public GitHub repository); analysis inside the Workbench is unaffected.
