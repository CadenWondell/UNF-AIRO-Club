notes: >-
  Text extracted from the official PDF on 2026-10-15: "CKD is defined as abnormalities of kidney
  structure or function, present for a minimum of 3 months, with implications for health."
  Table 1 (either present for a minimum of 3 months): markers of kidney damage (albuminuria ACR
  >=30 mg/g [>=3 mg/mmol], urine sediment abnormalities, persistent hematuria, tubular disorders,
  histology, imaging, kidney transplant history) or decreased GFR <60 ml/min per 1.73 m2 (G3a-G5).
  Recommendation 1.2.4.1: use a validated GFR estimating equation; the guideline adopts the 2021
  CKD-EPI creatinine equation (refitted without race). How an EHR phenotype operationalizes
  chronicity is a separate method decision (see eMERGE CKD algorithm).
